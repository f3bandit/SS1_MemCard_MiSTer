# Builds the core with Quartus 17.0.2 Lite (the same image MiSTer's own nightly builds use) and
# keeps the .rbf as a build artifact. Pushing a tag like v1.0 also makes a release with it.
name: Build core

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Simulate the card reader against a modelled card
        run: |
          sudo apt-get install -y iverilog >/dev/null
          sh sim/run.sh | tee sim.log
          grep -q "ALL PASSED" sim.log

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compile with Quartus
        run: |
          docker run --rm -v "$PWD":/project -w /project theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile SS1_MemCard.qpf
          sudo chown -R "$(id -u):$(id -g)" .
          name="SS1_MemCard_$(date -u +%Y%m%d).rbf"
          cp output_files/SS1_MemCard.rbf "$name"
          echo "RBF=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: SS1_MemCard
          path: |
            ${{ env.RBF }}
            output_files/*.rpt
            output_files/*.summary

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [simulate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SS1_MemCard
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" SS1_MemCard_*.rbf --repo "${{ github.repository }}" --title "SS1 Memory Card Tool ${GITHUB_REF_NAME}" --notes "Core build ${GITHUB_REF_NAME}." $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
